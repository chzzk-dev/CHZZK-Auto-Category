<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CHZZK : 자동 카테고리 연결 커넥터</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <div class="brand">
      <div class="logo">C</div>
      <div>
        <h3>CHZZK : 자동 카테고리 연결 커넥터</h3>
        <p>카테고리 변경을 자동으로 연결해주는 커넥터</p>
        <p>입니다.</p>
      </div>
    </div>


    <div class="status" id="status">연결 상태 확인 중…</div>

    <button id="studio" class="primary">치지직 스튜디오 열기</button>
    <button id="refresh">연결 상태 새로고침</button>
    <button id="downloadApp" class="download">Windows 앱 다운로드 · MSI</button>
    <p class="hint">다운로드 페이지에서 최신 MSI를 설치하고 최초 설정을 완료해 주세요. 기존 EXE 설치본의 전환 방법도 안내합니다.</p>
    <hr style="margin: 20px 0; border: none; border-top: 1px solid #727171;">
    <button id="log" class="download">로그 보러가기</button>
  </main>
  <script src="popup.js"></script>
</body>
</html>
